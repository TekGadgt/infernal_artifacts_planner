name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queued deploys collapse to the newest push; a deploy already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Type-check
        run: npm ci && npm run check
      # Third-party, so pinned to a commit. Bump the SHA and comment together.
      - name: Build and upload
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4

  # Only this job can publish to Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
